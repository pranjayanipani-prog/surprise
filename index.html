<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A birthday surprise</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--bg1:#2a1238;--bg2:#12081c;--gold:#f6b24a;--rose:#ff6f9f;--paper:#fbefd3;--ink:#4a2b12;--text:#fff4e6;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 80% at 50% 0%,var(--bg1),var(--bg2));color:var(--text);font:17px/1.4 'Outfit',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
.stage{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;opacity:0;pointer-events:none;transition:opacity .6s}
.screen.on{opacity:1;pointer-events:auto}
h1,h2{margin:0}
.hint{position:absolute;bottom:28px;left:0;right:0;font-size:14px;color:#ffffffa0;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.btn{font:600 17px 'Outfit',sans-serif;border:0;border-radius:999px;padding:14px 28px;background:linear-gradient(135deg,var(--gold),#ee7d3c);color:#3a1600;cursor:pointer}
button:focus-visible{outline:2px solid #fff;outline-offset:3px}
/* loading */
#s0 ul{list-style:none;padding:0;margin:20px 0 0;text-align:left}
#s0 li{opacity:.25;transition:.4s;margin:8px 0}#s0 li.d{opacity:1}
/* intro */
#heart{position:relative;width:300px;height:280px}
#heart i{position:absolute;width:30px;height:36px;border-radius:50% 50% 50% 50%/45% 45% 55% 55%;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.pink{color:var(--rose);font-weight:800;font-size:34px}
/* cake */
.cake{position:relative;width:200px;height:190px;margin:24px 0}
.cake .plate{position:absolute;bottom:0;left:0;right:0;height:14px;border-radius:8px;background:#e9d9c6}
.cake .l1{position:absolute;bottom:14px;left:10px;right:10px;height:62px;background:#5a2d1c;border-radius:6px}
.cake .l2{position:absolute;bottom:76px;left:30px;right:30px;height:54px;background:#6d3822;border-radius:6px}
.cake .ic{position:absolute;bottom:130px;left:30px;right:30px;height:16px;background:#fff1de;border-radius:8px}
.cake .c{position:absolute;bottom:144px;left:50%;width:8px;height:38px;margin-left:-4px;background:#fff1de;border-radius:2px}
.cake .f{position:absolute;bottom:180px;left:50%;width:14px;height:22px;margin-left:-7px;background:radial-gradient(#fff 15%,#ffc34a 55%,#ff7a18);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;animation:fl .25s infinite alternate}
@keyframes fl{to{transform:scale(1.1,.9) rotate(4deg)}}
.cake.out .f{display:none}
/* balloons */
#bal{position:relative;width:100%;flex:1;min-height:260px}
.bl{position:absolute;width:74px;height:90px;border-radius:50% 50% 50% 50%/45% 45% 55% 55%;border:0;cursor:pointer;animation:fb 4s ease-in-out infinite;transition:transform .2s}
.bl::after{content:'';position:absolute;left:50%;top:100%;width:2px;height:40px;background:#ffffff66}
@keyframes fb{50%{translate:0 -14px}}
.bl.pop{transform:scale(1.6);opacity:0;pointer-events:none;transition:.25s}
#reasons{width:100%;display:grid;gap:8px;margin-top:8px;max-height:36%;overflow:auto}
.rs{border:1.5px solid var(--gold);border-radius:12px;padding:10px 14px;text-align:left;background:#ffffff10;animation:in .4s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.rs b{display:block;font-size:12px;color:var(--gold);margin-bottom:2px}
/* envelope */
.env{position:relative;width:280px;height:180px;background:#e2a24a;border-radius:8px;cursor:pointer;box-shadow:0 12px 30px #0006}
.env::before{content:'';position:absolute;inset:0;background:linear-gradient(to bottom right,transparent 49.5%,#c98a35 50%) left/50% 100% no-repeat,linear-gradient(to bottom left,transparent 49.5%,#c98a35 50%) right/50% 100% no-repeat;border-radius:8px}
.seal{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:var(--gold);border:3px solid #fff3;display:grid;place-items:center;font-weight:800;color:#4a2b12}
/* letter */
.paper{width:100%;max-height:78%;overflow:auto;background:repeating-linear-gradient(var(--paper) 0 31px,#e8d4a8 31px 32px);color:var(--ink);border-radius:12px;padding:20px 20px 12px;text-align:left;font:22px/32px 'Patrick Hand',cursive;box-shadow:0 12px 30px #0006}
.paper .dear{font-weight:700;border-bottom:1px solid #d8bf8a;margin-bottom:6px}
.sig{text-align:right;color:#b2661a;font-style:italic;opacity:0;transition:1s}.sig.on{opacity:1}
/* photo */
.frame{position:relative;width:78%;max-width:300px;aspect-ratio:3/4;border:6px solid #fff;border-radius:18px;overflow:hidden;background:#00000040;display:grid;place-items:center;margin-top:30px}
.frame img{width:100%;height:100%;object-fit:cover}
.bunt{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;display:flex;justify-content:space-around;font-size:26px}
.pick{cursor:pointer;color:#ffffffc0;padding:16px;font-size:15px}
.skip{margin-top:18px;background:none;border:0;color:#fff9;font:inherit;cursor:pointer}
/* final */
.big{font-weight:800;font-size:44px;line-height:1.05;letter-spacing:.02em}
.big em{display:block;font-style:normal;color:var(--gold)}
.conf{position:fixed;top:0;width:8px;height:12px;pointer-events:none;z-index:9;animation:cf 1.4s ease-out forwards}
@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(540deg);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

/* ================================= */
const $=id=>document.getElementById(id), C=CONFIG;
let cur=-1, tmr=[];
function go(n){tmr.forEach(clearTimeout);tmr=[];document.querySelectorAll('.screen').forEach((s,i)=>s.classList.toggle('on',i===n));cur=n;({0:s0,1:s1,2:s2,3:s3,4:s4,5:s5,6:s6,7:s7})[n]();}
function later(f,ms){tmr.push(setTimeout(f,ms));}
function confetti(x,y,n=26){const cols=['#ff6f9f','#f6b24a','#6fd3ff','#9bff9b','#c79bff'];for(let i=0;i<n;i++){const d=document.createElement('i');d.className='conf';d.style.left=x+'px';d.style.top=y+'px';d.style.background=cols[i%5];d.style.setProperty('--x',(Math.random()-.5)*260+'px');d.style.setProperty('--y',(Math.random()*-160-20)+'px');document.body.appendChild(d);setTimeout(()=>d.remove(),1500);}}
/* 0 loading */
let started=false;
function s0(){$('loadT').textContent=C.loadingTitle;const ul=$('loadL');ul.innerHTML='';if(!started){const b=document.createElement('button');b.className='btn';b.textContent='Open your surprise 🎁';b.style.marginTop='20px';b.onclick=()=>{started=true;const a=$('song');a.volume=.8;a.play().catch(()=>{});$('mute').style.display='block';go(0);};ul.parentNode.querySelector('h2').textContent='A surprise for '+C.to;ul.appendChild(b);return;}C.loadingSteps.forEach((t,i)=>{const li=document.createElement('li');li.textContent='✓  '+t;ul.appendChild(li);later(()=>li.classList.add('d'),500+i*700);});later(()=>go(1),500+C.loadingSteps.length*700+600);}
$('mute').onclick=()=>{const a=$('song');a.muted=!a.muted;$('mute').textContent=a.muted?'🔇':'🔊';};
/* 1 intro */
function s1(){$('i1').textContent=C.introSmall;$('i2').textContent=C.introBig;$('i3').textContent=C.introLine;const h=$('heart');if(!h.children.length){const cols=['#ff5d8f','#ff8fb1','#ff3d7f','#ffb3c7','#f6b24a'];for(let k=0;k<70;k++){const t=k/70*Math.PI*2,x=16*Math.pow(Math.sin(t),3),y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));const b=document.createElement('i');b.style.left=150+x*8-15+(Math.random()*10-5)+'px';b.style.top=100+y*8-18+'px';b.style.background=cols[k%5];b.style.animationDelay=(k%7)*.3+'s';h.appendChild(b);}}$('s1').onclick=()=>go(2);}
/* 2 cake */
function s2(){$('c1').textContent=C.cakeTitle+' 🎂';$('c2').textContent='';$('c3').style.display='';$('cake').classList.remove('out');$('s2').onclick=null;$('cake').onclick=e=>{e.stopPropagation();$('cake').classList.add('out');$('c2').textContent=C.cakeAfter;$('c3').textContent='tap anywhere to continue';const r=$('cake').getBoundingClientRect();confetti(r.left+r.width/2,r.top,40);later(()=>{$('s2').onclick=()=>go(3);},300);};}
/* 3 balloons */
function s3(){$('b1').textContent=C.balloonsTitle+' 🎈';$('b2').textContent=C.balloonsSub;const area=$('bal');area.innerHTML='';$('reasons').innerHTML='';$('b3').textContent='';$('s3').onclick=null;let left=C.reasons.length,shown=0;const cols=['#ff6f9f','#4fc3d9','#ff8a65','#b388ff','#ffd54f'];C.reasons.forEach((r,i)=>{const b=document.createElement('button');b.className='bl';b.setAttribute('aria-label','Balloon '+(i+1));b.style.background='radial-gradient(circle at 35% 30%,#fff8,'+cols[i%5]+' 60%)';b.style.left=(6+(i%3)*30+(i>2?14:0))+'%';b.style.top=(i>2?52:8)+'%';b.style.animationDelay=i*.5+'s';b.onclick=()=>{const rc=b.getBoundingClientRect();confetti(rc.left+37,rc.top+40,18);b.classList.add('pop');const d=document.createElement('div');d.className='rs';d.innerHTML='<b></b><span></span>';d.querySelector('b').textContent='REASON NO.'+(++shown);d.querySelector('span').textContent=r;$('reasons').appendChild(d);d.scrollIntoView({block:'nearest'});if(--left===0){$('b3').textContent='tap anywhere to continue';later(()=>{$('s3').onclick=()=>go(4);},300);}};area.appendChild(b);});}
/* 4 envelope */
function s4(){$('e1').textContent=C.envelopeTitle;$('e2').textContent=C.envelopeHint;$('seal').textContent=C.to[0];$('env').onclick=()=>go(5);}
/* 5 letter */
function s5(){$('dear').textContent=C.letterDear;$('body').textContent='';$('sig').textContent=C.letterSign;$('sig').classList.remove('on');$('nextL').style.display='none';let i=0;(function t(){if(cur!==5)return;$('body').textContent=C.letter.slice(0,++i);$('paper').scrollTop=1e5;if(i<C.letter.length)later(t,32);else{$('sig').classList.add('on');$('nextL').style.display='';}})();$('nextL').onclick=()=>go(6);}
/* 6 photo */
